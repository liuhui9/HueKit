<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1726" />
    <meta name="description" content="输入一个颜色，生成协调的五色搭配，预览效果并复制色值。" />
    <title>拾色间 · 配色搭配工具</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23172841'/%3E%3Crect x='14' y='28' width='9' height='21' rx='4' fill='%23637bea' transform='rotate(-14 18 38)'/%3E%3Crect x='29' y='14' width='9' height='35' rx='4' fill='%23f6aa58' transform='rotate(-14 33 32)'/%3E%3Crect x='44' y='22' width='9' height='27' rx='4' fill='%23afc0ff' transform='rotate(-14 48 35)'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="拾色间首页">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>拾色间</span>
        </a>
        <span class="header-note">一个颜色，打开更多可能</span>
      </header>

      <main class="workspace">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow">COLOR WORKSPACE / 01</p>
          <h1 id="page-title">从一个颜色开始。</h1>
          <p>选定主色，试试不同的搭配方式。喜欢的颜色点一下就能复制。</p>
        </section>

        <div class="tool-layout">
          <section class="control-panel" aria-labelledby="controls-title">
            <div class="panel-heading">
              <span class="step-number">01</span>
              <h2 id="controls-title">设定主色</h2>
            </div>

            <div class="field-group">
              <label for="color-picker">选择颜色</label>
              <div class="color-control">
                <input id="color-picker" type="color" value="#5369d8" aria-label="使用取色器选择主色" />
                <input id="hex-input" type="text" value="#5369D8" maxlength="7" spellcheck="false" autocomplete="off" inputmode="text" aria-label="主色色值" aria-describedby="hex-help" />
              </div>
              <p id="hex-help" class="field-help">支持 #RGB 或 #RRGGBB</p>
            </div>

            <fieldset class="field-group scheme-field">
              <legend>搭配方式</legend>
              <div class="scheme-options" id="scheme-options">
                <label><input type="radio" name="scheme" value="analogous" checked /><span>邻近色</span></label>
                <label><input type="radio" name="scheme" value="complementary" /><span>互补色</span></label>
                <label><input type="radio" name="scheme" value="triadic" /><span>三角色</span></label>
                <label><input type="radio" name="scheme" value="monochrome" /><span>同色系</span></label>
              </div>
            </fieldset>

            <button class="random-button" id="random-button" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h3c6 0 4 10 10 10h3m0 0-3-3m3 3-3 3M4 17h3c2.2 0 3.2-1.3 4-3m3-4c.8-1.7 1.8-3 3-3h3m0 0-3-3m3 3-3 3" stroke-linecap="round" stroke-linejoin="round" /></svg>
              换一个主色
            </button>
          </section>

          <section class="result-panel" aria-labelledby="results-title">
            <div class="result-heading">
              <div class="panel-heading">
                <span class="step-number">02</span>
                <div>
                  <h2 id="results-title">你的配色</h2>
                  <p id="scheme-description">色相相近，过渡自然。</p>
                </div>
              </div>
              <button class="copy-all-button" id="copy-all-button" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke-linecap="round" /></svg>
                复制整组
              </button>
            </div>

            <div class="palette" id="palette" aria-label="生成的五种颜色"></div>

            <div class="preview-heading">
              <span class="step-number">03</span>
              <div>
                <h2>看看实际效果</h2>
                <p>把这组颜色放进一个简洁的界面里。</p>
              </div>
            </div>
            <div class="preview" id="preview" aria-label="配色界面预览">
              <div class="preview-card">
                <div class="preview-topline"><span class="preview-brand">MONO / STUDIO</span><span class="preview-icon" aria-hidden="true">✦</span></div>
                <div class="preview-content">
                  <span class="preview-overline">NEW COLLECTION</span>
                  <strong>留一点空间<br />给新的灵感。</strong>
                  <span class="preview-cta">探索系列 <span aria-hidden="true">↗</span></span>
                </div>
                <div class="preview-footer"><span>色彩，让想法更清晰。</span><span>01 / 03</span></div>
              </div>
              <div class="preview-side" aria-hidden="true"><div class="preview-side-circle"></div><span>COLOR IN USE</span></div>
            </div>
          </section>
        </div>
      </main>

      <footer class="site-footer"><span>拾色间</span><span>为每一个好点子找到颜色。</span></footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
